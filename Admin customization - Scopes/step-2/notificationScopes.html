<!-- Pendo code block: HTML tab
     One row per message type, styled like the Manage default permissions list.
     data-name is the text written to the hidden poll; the "selected" option is the starting value. -->
<div class="qs-list" role="group" aria-label="Notifications and messaging permissions">
  <div class="qs-row">
    <div class="qs-text">
      <span class="qs-title" id="qs-title-onboarding">Onboarding guides</span>
      <span class="qs-desc" id="qs-desc-onboarding">Guided tours and tips the first time users open the hub, apps and new areas of Qlik Cloud.</span>
    </div>
    <select class="qs-select" data-name="Onboarding guides" aria-labelledby="qs-title-onboarding" aria-describedby="qs-desc-onboarding">
      <option value="Allowed" selected>Allowed</option>
      <option value="Not allowed">Not allowed</option>
    </select>
  </div>
  <div class="qs-row">
    <div class="qs-text">
      <span class="qs-title" id="qs-title-features">New feature announcements</span>
      <span class="qs-desc" id="qs-desc-features">“What’s new” highlights when Qlik releases features to your tenant.</span>
    </div>
    <select class="qs-select" data-name="New feature announcements" aria-labelledby="qs-title-features" aria-describedby="qs-desc-features">
      <option value="Allowed" selected>Allowed</option>
      <option value="Not allowed">Not allowed</option>
    </select>
  </div>
  <div class="qs-row">
    <div class="qs-text">
      <span class="qs-title" id="qs-title-surveys">Surveys and feedback</span>
      <span class="qs-desc" id="qs-desc-surveys">In-context feedback badges and popup surveys</span>
    </div>
    <select class="qs-select" data-name="Surveys and feedback" aria-labelledby="qs-title-surveys" aria-describedby="qs-desc-surveys">
      <option value="Allowed" selected>Allowed</option>
      <option value="Not allowed">Not allowed</option>
    </select>
  </div>
</div>
