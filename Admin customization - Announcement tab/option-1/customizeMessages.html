<!-- Pendo code block: HTML tab
     One row per message type. data-name is the text written to the hidden poll;
     aria-checked sets the starting state ("true" = On). -->
<div class="qt-toggles" role="group" aria-label="In-product messages">
  <div class="qt-toggle-row">
    <button type="button" class="qt-switch" role="switch" aria-checked="true" aria-labelledby="qt-title-onboarding" aria-describedby="qt-desc-onboarding" data-name="Onboarding guides"></button>
    <div class="qt-text">
      <span class="qt-title" id="qt-title-onboarding">Onboarding guides</span>
      <span class="qt-desc" id="qt-desc-onboarding">Guided tours and tips the first time users open the hub, apps and new areas of Qlik Cloud.</span>
    </div>
  </div>
  <div class="qt-toggle-row">
    <button type="button" class="qt-switch" role="switch" aria-checked="true" aria-labelledby="qt-title-features" aria-describedby="qt-desc-features" data-name="New feature announcements"></button>
    <div class="qt-text">
      <span class="qt-title" id="qt-title-features">New feature announcements</span>
      <span class="qt-desc" id="qt-desc-features">“What’s new” highlights when Qlik releases features to your tenant.</span>
    </div>
  </div>
  <div class="qt-toggle-row">
    <button type="button" class="qt-switch" role="switch" aria-checked="true" aria-labelledby="qt-title-surveys" aria-describedby="qt-desc-surveys" data-name="Surveys and feedback"></button>
    <div class="qt-text">
      <span class="qt-title" id="qt-title-surveys">Surveys and feedback</span>
      <span class="qt-desc" id="qt-desc-surveys">In-context feedback badges and popup surveys</span>
    </div>
  </div>
</div>
